<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Viaduct — Redesign</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    color: #1a1a1a;
  }
  button { font: inherit; cursor: default; }
  ::selection { background: rgba(10,132,255,0.25); }
  #root { width: 100%; height: 100%; }

  /* Scrollbars — thin macOS style */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: rgba(0,0,0,0.18); border-radius: 5px;
    border: 3px solid transparent; background-clip: content-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.3); background-clip: content-box; border: 3px solid transparent; }
  ::-webkit-scrollbar-track { background: transparent; }

  @keyframes viaPulse {
    0%   { transform: scale(0.5); opacity: 0.8; }
    100% { transform: scale(1.8); opacity: 0; }
  }
  @keyframes viaFadeIn  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes viaSlideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes viaPopover {
    from { opacity: 0; transform: scale(0.92) translateY(-6px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script type="text/babel" src="sidebar.jsx"></script>
<script type="text/babel" src="tunnel-list.jsx"></script>
<script type="text/babel" src="tunnel-detail.jsx"></script>
<script type="text/babel" src="editor-and-menubar.jsx"></script>
<script type="text/babel" src="main.jsx"></script>
</body>
</html>
