<svg xmlns="http://www.w3.org/2000/svg" width="700" height="900" viewBox="0 0 700 900" role="img" aria-labelledby="title desc">
  <title id="title">Viaduct menu bar popover</title>
  <desc id="desc">The Viaduct menu bar popover showing tunnel search, quick connect controls, and status.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="125%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#10141d" flood-opacity=".2"/>
    </filter>
    <style>
      .bg{fill:#eceadf}.panel{fill:#fbfaf6;stroke:#d8d4c8}.title{fill:#15171c;font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.text{fill:#15171c;font:600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.sub{fill:#54565e;font:500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.small{fill:#8d8f97;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace}.line{stroke:#dedacf}.field{fill:#f3f1ea;stroke:#d8d4c8}.green{fill:#1f9d4d}.amber{fill:#e08a00}.blue{fill:#1f5fff}.muted{fill:#b9bbc4}
    </style>
  </defs>
  <rect class="bg" width="700" height="900"/>
  <rect x="150" y="70" width="400" height="760" rx="18" class="panel" filter="url(#shadow)"/>
  <path d="M329 70l21-24 21 24" fill="#fbfaf6" stroke="#d8d4c8" stroke-linejoin="round"/>
  <text x="190" y="124" class="title">Viaduct</text>
  <rect x="435" y="98" width="74" height="34" rx="17" fill="#edf7f0" stroke="#c9e5d1"/><circle cx="454" cy="115" r="5" class="green"/><text x="468" y="120" class="small" fill="#1f9d4d">2 LIVE</text>
  <rect x="190" y="156" width="320" height="42" rx="10" class="field"/><text x="216" y="182" class="sub">Search tunnels</text>

  <g>
    <circle cx="207" cy="242" r="7" class="green"/><text x="228" y="247" class="text">Postgres staging</text><text x="228" y="270" class="sub">127.0.0.1:5432</text>
    <rect x="430" y="230" width="80" height="34" rx="17" fill="#f3f1ea" stroke="#d8d4c8"/><text x="452" y="252" class="small">STOP</text>
  </g>
  <line x1="190" y1="303" x2="510" y2="303" class="line"/>
  <g>
    <circle cx="207" cy="345" r="7" class="green"/><text x="228" y="350" class="text">Grafana production</text><text x="228" y="373" class="sub">127.0.0.1:3000</text>
    <rect x="430" y="333" width="80" height="34" rx="17" fill="#f3f1ea" stroke="#d8d4c8"/><text x="452" y="355" class="small">STOP</text>
  </g>
  <line x1="190" y1="406" x2="510" y2="406" class="line"/>
  <g>
    <circle cx="207" cy="448" r="7" class="amber"/><text x="228" y="453" class="text">SOCKS proxy</text><text x="228" y="476" class="sub">retrying in 12s</text>
    <rect x="430" y="436" width="80" height="34" rx="17" fill="#fff4dd" stroke="#f0d5a6"/><text x="447" y="458" class="small" fill="#a86600">RETRY</text>
  </g>
  <line x1="190" y1="509" x2="510" y2="509" class="line"/>
  <g>
    <circle cx="207" cy="551" r="7" class="muted"/><text x="228" y="556" class="text">Webhook receiver</text><text x="228" y="579" class="sub">remote :8080</text>
    <rect x="430" y="539" width="80" height="34" rx="17" fill="#eef3ff" stroke="#b8c9ff"/><text x="444" y="561" class="small" fill="#1f5fff">START</text>
  </g>
  <rect x="190" y="636" width="320" height="72" rx="12" fill="#15171c"/>
  <text x="214" y="666" fill="#f8f7f0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="600">ssh -N -L 127.0.0.1:5432...</text>
  <text x="214" y="690" fill="#8d8f97" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">Command preview for selected tunnel</text>
  <rect x="190" y="742" width="150" height="42" rx="9" fill="#1f5fff"/><text x="230" y="768" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="14" font-weight="700">New Tunnel</text>
  <rect x="360" y="742" width="150" height="42" rx="9" class="field"/><text x="400" y="768" class="sub" fill="#15171c">Open App</text>
</svg>
